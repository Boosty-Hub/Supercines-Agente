[build]
  base    = "web"
  command = "pnpm build"
  publish = ".next"
  # Con base = "web", Netlify cancela el build si no cambió nada DENTRO de web/
  # («Canceled build due to no content change»). Pero la web embebe las migraciones y
  # las Edge Functions de ../supabase (codegen del prebuild): un commit que solo toca
  # supabase/ dejaba publicada una web vieja, y el panel comparaba contra código viejo.
  # Corre desde web/: exit 0 = saltar el build, cualquier otro código (incluido el error
  # sin CACHED_COMMIT_REF del primer build) = construir.
  ignore  = "git diff --quiet \"$CACHED_COMMIT_REF\" \"$COMMIT_REF\" -- . ../supabase ../netlify.toml"

[build.environment]
  # Node 20 llegó a EOL (abril 2026); Next 15 corre en 22 LTS.
  NODE_VERSION = "22"
  # Mantener igual a "packageManager" de web/package.json. El lockfile lleva `overrides`
  # (los declara pnpm-workspace.yaml) y pnpm < 10.6 los rechaza con
  # ERR_PNPM_LOCKFILE_CONFIG_MISMATCH bajo --frozen-lockfile; Netlify elige un pnpm
  # por defecto según el lockfile y puede quedar en una versión vieja.
  PNPM_VERSION = "10.32.1"

[[plugins]]
  package = "@netlify/plugin-nextjs"
